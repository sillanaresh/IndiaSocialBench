[project]
name = "bhavbench"
version = "0.1.0"
description = "IndiaSocialBench eval harness: run, judge, and score models on the IndiaSocialBench dataset"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bhavbench = "bhavbench.cli:main"
indiasocialbench = "bhavbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bhavbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
