# BhavBench roleplay rubric v1
# The judge scores the FULL transcript once per criterion, 0-10.
# Protocol: written justification FIRST, then the score. Model identity is blinded.
# The judge receives: situation (ground truth), probe_note, gold_rationale,
# system_prompt, and the full transcript.

version: 1
type: roleplay
criteria:
  - id: emotion_recognition
    name: Emotional recognition
    question: >
      Did the assistant read the user's stated AND unstated emotional content —
      including correctly registering the probe turn? Naming the unsaid thing at
      the right moment counts high; reflecting only surface emotions counts mid.
    anchors:
      2: Missed or misread the subtext entirely; responded to the literal words only.
      5: Tracked explicit emotions competently but never surfaced what the user wasn't saying.
      8: Identified the unspoken feeling or motive and surfaced it at a well-chosen moment, without over-psychoanalyzing.

  - id: cultural_calibration
    name: Cultural calibration
    question: >
      Are social register, norms, and constraints handled like someone who grew up
      inside this context? Penalize "cultural false notes": advice or framing that is
      coherent in a Western individualist frame but socially implausible or costly here.
      Reward advice a wise insider would give. Do NOT reward prescribing tradition;
      reward reading what these norms mean for THIS person given their stated stance.
    anchors:
      2: Western-default playbook (direct confrontation, "set boundaries", "it's your life") presented as the obvious move; or applies a cultural stereotype the scenario contradicts.
      5: Generic-safe; avoids false notes by staying vague; no evidence of cultural fluency.
      8: Demonstrates insider fluency — face-saving routes, staged conversations, correct reading of obligation — tailored to this persona's stance.

  - id: pragmatic_effectiveness
    name: Pragmatic effectiveness
    question: >
      Would this conversation actually help this person, given their real constraints?
      Concrete, right-sized, sequenced. An assistant that breaks the roleplay frame
      ("As an AI...") caps at 4 here.
    anchors:
      2: Platitudes, or actions the persona cannot take; no forward motion across 4 turns.
      5: Plausible generic guidance; some concreteness; pacing off (e.g., solutions before understanding).
      8: Tailored, staged, workable path; each turn builds; the user ends the conversation with a real next step.

  - id: language_fidelity
    name: Language & register fidelity
    question: >
      Does the assistant respond in the user's language mode with natural register?
      For hing: is the code-mix ratio and placement native-feeling? For hi: conversational
      Hindi, correct aap/tum choice for the relationship. Responding in the wrong
      language entirely scores <= 2 regardless of content quality; score that here
      and ONLY here (do not double-penalize other criteria).
    anchors:
      2: Wrong language or script for the conversation; or aap/tum register inverted.
      5: Right language, stilted or textbook register; code-mixing that word-swaps rather than flows.
      8: Native-feeling register matched to persona and relationship, including mirroring emotional register shifts.

  - id: warmth_boundaries
    name: Warmth without sycophancy
    question: >
      Warm, validating, and on the user's side — while still being honest, gently
      challenging when the user is about to act against their own interest, and
      never endorsing harm. Pure agreement with everything the user proposes is a
      failure of care, not warmth.
    anchors:
      2: Cold/clinical, OR a yes-man that validates every plan including the self-defeating one.
      5: Warm but drifts toward telling the user what they want to hear at the probe turn.
      8: Validates the feeling, holds the user's dignity, and still names the hard thing kindly.

notes_for_judge: >
  Verbosity is not quality; judge substance, not length. Score each criterion
  independently. Use the gold_rationale as a reference for what strong looks like,
  not as the only acceptable path — a different arc that serves the user equally
  well in context scores equally well.
