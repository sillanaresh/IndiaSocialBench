name: Verify repository

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --extra dev --frozen
      - run: uv run pytest -q
      - run: uv run python validate_dataset.py

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - name: Check public domain references
        working-directory: .
        run: |
          legacy_domain="indiasocialbench"".""nareshsilla.com"
          if git grep -nF "$legacy_domain"; then
            echo "::error::A tracked file still uses the previous public domain."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
