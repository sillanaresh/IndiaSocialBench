# Evaluate a new model on IndiaSocialBench. Triggered from the GitHub UI.
#
# How to use (works from a phone):
#   1. One-time setup: repo Settings → Secrets and variables → Actions →
#      New repository secret: OPENROUTER_API_KEY = <your key with credits>
#   2. GitHub → Actions tab → "Evaluate a model on IndiaSocialBench" → Run workflow →
#      type the OpenRouter model id (e.g. anthropic/claude-fable-5) → Run.
#   3. ~15-30 min later a commit lands on main with the transcripts, judgments,
#      and regenerated leaderboard. If the site is on Vercel, it redeploys itself.
#
# Cost guard: the run aborts before judging if the eval phase produced errors,
# and the whole job is capped at 90 minutes.

name: Evaluate a model on IndiaSocialBench

on:
  workflow_dispatch:
    inputs:
      model:
        description: "OpenRouter model id (e.g. anthropic/claude-fable-5) or sarvam:<model>"
        required: true
        type: string
      judge:
        description: "Judge model (keep default for board consistency)"
        required: false
        default: "google/gemini-3.1-flash-lite"
        type: string

concurrency: india-social-bench-eval  # one eval at a time; runs queue up

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Preflight — validate API key before spending
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          resp=$(curl -s https://openrouter.ai/api/v1/credits -H "Authorization: Bearer $OPENROUTER_API_KEY")
          echo "credits response: $resp"
          echo "$resp" | grep -q total_credits || { echo "::error::OPENROUTER_API_KEY secret is invalid — fix it in repo Settings > Secrets"; exit 1; }
          left=$(echo "$resp" | python3 -c "import json,sys; d=json.load(sys.stdin)['data']; print(d['total_credits']-d['total_usage'])")
          echo "remaining balance: \$$left"
          python3 -c "import sys; sys.exit(0 if float('$left') >= 0.75 else 1)" || { echo "::error::Only \$$left OpenRouter credit left — top up at openrouter.ai/settings/credits before evaluating (a typical model needs \$0.3-\$7)"; exit 1; }

      - name: Run evaluation
        working-directory: harness
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: |
          uv sync
          uv run indiasocialbench run --model "${{ inputs.model }}" || { echo "--- first error detail:"; grep -l '"error"' ../results/raw/*/items/*.json | head -1 | xargs cat | python3 -c "import json,sys; print(json.load(sys.stdin).get('error'))"; exit 2; }
          uv run indiasocialbench judge --model "${{ inputs.model }}" --judges "${{ inputs.judge }}"
          uv run indiasocialbench score --judges "${{ inputs.judge }}"

      - name: Commit results
        run: |
          git config user.name "india-social-bench-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/
          git commit -m "Board update: evaluate ${{ inputs.model }}" || echo "nothing to commit"
          git push origin main
